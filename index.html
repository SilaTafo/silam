<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <title>Our Anniversary Countdown</title>
  <style>
    :root { --fly-duration: 18s; }

    body:not(.ready) header { opacity:0; }
    body.ready header { opacity:1; transition:opacity .2s ease; }

    

    /* Signature — back to original bottom-right */
    .signature {
      position: absolute;
      bottom: 20px;
      right: 40px;
      font-family: 'Brush Script MT', cursive;
      font-size: 3rem;
      color: #fff;
      opacity: 0.85;
      text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(255,0,100,0.4);
      transform: rotate(-5deg);
      animation: glowPulse 3s infinite;
      z-index: 4;
    }

    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(255,0,100,0.4); }
      50% { text-shadow: 0 0 20px rgba(255,150,200,0.8), 0 0 40px rgba(255,0,100,0.6); }
    }

    /* Optional: watermark background */
    .watermark {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12rem;
      font-family: 'Brush Script MT', cursive;
      color: rgba(255,255,255,0.08);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    /* Simple header for sound toggle only */
    header {
    position:absolute; top:12px; right:12px;
    display:flex; gap:10px;
    z-index:5;
    }

    .control-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.25);
    cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,.25);
    font-weight:600; color:#fff;
    font-size:0.9rem;
    transition: background .2s, transform .2s;
    }
    .control-btn:hover { transform: scale(1.05); background:rgba(255,255,255,.2); }
    .control-btn[aria-pressed="true"]{ background:rgba(0,0,0,.35); }


    body {
      margin: 0;
      min-height: 100svh; 
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Day & Night backgrounds */
    body.day {
        background: linear-gradient(135deg, #ff9ab1, #ffb347);
        color: #fff;
    }
    body.night {
        background: radial-gradient(circle at top, #0b0c2a, #000);
        color: #fff;
    }

    /* Stars */
    .star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0 !important;     /* FORCE hidden by default */
    animation: twinkle 2s infinite alternate;
    transition: opacity .5s ease;
    }

    body.night .star {
    opacity: 0.8 !important;   /* FORCE visible only in night mode */
    }

    @keyframes twinkle {
        from { opacity: 0.2; }
        to { opacity: 1; }
    }

    /* Aurora Orbs */
    /* Aurora Ribbons */
    .aurora-ribbon {
    position: absolute;
    width: 40vw; 
    height: 100vh;
    top: 0;
    left: 0;
    background: linear-gradient(180deg, rgba(0,255,200,0.15) 0%, rgba(0,0,0,0) 80%);
    filter: blur(80px);
    opacity: 0;
    pointer-events: none;
    animation: wave 30s ease-in-out infinite alternate;
    z-index: 0;
    transform-origin: center;
    transition: opacity 2s ease;
    }

    .star, .aurora-ribbon { will-change: transform, opacity; }

    /* Only show at night */
    body.night .aurora-ribbon {
    opacity: 1;
    }

    /* Wavy motion */
    @keyframes wave {
    0%   { transform: skewX(-10deg) scaleX(1) translateX(0); }
    50%  { transform: skewX(10deg) scaleX(1.2) translateX(5vw); }
    100% { transform: skewX(-10deg) scaleX(1) translateX(-5vw); }
    }



    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      animation: wiggle 2s infinite;
    }

    #countdown {
      display: flex;
      gap: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 40px;
      animation: wiggle 3s infinite;
      flex-wrap: wrap;
    }

    .unit { display: flex; flex-direction: column; align-items: center; }
    .number { font-size: 2.2rem; transition: transform .12s ease; }
    .label { font-size: 0.8rem; opacity: 0.85; }

    /* Characters */
    .couple { display:flex; gap:60px; align-items:flex-end; transition: gap 1s ease; position:relative; z-index:2; }
    .character { display:flex; flex-direction:column; align-items:center; position:relative; animation:bounce 2s infinite; }
    .face { width:90px; height:90px; border-radius:50%; border:3px solid #000; background:#ffe1ec; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#ff4d6d; z-index:2; overflow:hidden; }
    .face img{ width:100%; height:100%; object-fit:cover; display:block; }
    .body { width:100px; height:120px; background:#333; border-radius:50% 50% 20% 20%; margin-top:-20px; display:flex; align-items:center; justify-content:center; }
    .hand { position:absolute; bottom:30px; width:20px; height:20px; background:#ff4d6d; border-radius:50%; }
    .left-hand { left:80px; } .right-hand { right:80px; }

    /* Floating hearts — REVERTED to original idle style */
    .heart { position:absolute; color:#fff; font-size:20px; animation: floatUp 4s linear infinite; pointer-events:none; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity:1; } 100% { transform: translateY(-400px) scale(1.5); opacity:0; } }

    /* Celebration */
    .celebration { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; color:#fff; font-size:2rem; z-index:10; animation:fadeIn 2s forwards; }

    @keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes wiggle { 0%,100% { transform:rotate(0deg); } 25% { transform:rotate(2deg); } 75% { transform:rotate(-2deg); } }

    /* Teaser */
    .teaser { animation:jiggle 0.4s infinite alternate !important; }
    @keyframes jiggle { from{ transform:rotate(-5deg) scale(1.05);} to{ transform:rotate(5deg) scale(1.05);} }
    .teaser-gap { gap:30px !important; }

    /* Plane */
    #plane { position:absolute; top:20%; right:-100px; font-size:2.5rem; display:none; z-index:5; }
    .fly { display:block !important; animation:flyBack var(--fly-duration) linear forwards; }
    @keyframes flyBack { from { transform: translateX(0) rotate(-10deg); } to { transform: translateX(-120vw) rotate(10deg); } }

    /* Plane trail */
    .trail { position:absolute; color:#fff; font-size:1.2rem; opacity:0.8; animation: floatTrail 4s linear forwards; pointer-events:none; }
    @keyframes floatTrail { from{ opacity:1; transform:translateY(0);} to{ opacity:0; transform:translateY(-40px);} }

    /* Love Notes */
    .love-note {
    pointer-events: auto;
    cursor: pointer;
    position: absolute;
    padding: 8px 14px;
    background: rgba(255,255,255,0.9);
    color: #ff4d6d;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(20px) scale(0.9);
    animation: floatNote 6s forwards;
    z-index: 5;
    }

    .fragment {
    position: absolute;
    font-size: 1rem;
    font-weight: 600;
    color: #ff4d6d;
    pointer-events: none;
    animation: fragmentFly 0.8s forwards;
    }

    @keyframes fragmentFly {
    from { opacity: 1; transform: translate(0,0) scale(1); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.6) rotate(20deg); }
    }


    @keyframes floatNote {
    0%   { opacity: 0; transform: translateY(20px) scale(0.9); }
    20%  { opacity: 1; transform: translateY(0) scale(1); }
    80%  { opacity: 1; transform: translateY(-80px) scale(1); }
    100% { opacity: 0; transform: translateY(-120px) scale(0.95); }
    }

    @keyframes popNote {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: scale(0.5) rotate(-20deg); opacity: 0; }
    }

    .love-note.pop {
    animation: popNote 0.6s forwards;
    background: transparent;
    color: transparent;
    box-shadow: none;
    }

    .sparkle {
    position: absolute;
    font-size: 1.2rem;
    pointer-events: none;
    animation: sparkleFade 0.8s forwards;
    }

    @keyframes sparkleFade {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.5) translateY(-20px); }
    }


    /* Vignette */
    .vignette { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; background: radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%); z-index:1; opacity:0; transition:opacity 1s ease; }
    .vignette.show { opacity:1; }

    /* Flags */
    .flag { position:absolute; top:10%; font-size:2.5rem; z-index:3; }
    .flag.korea { right:20px; } .flag.turkey { left:20px; }

    /* Sneak Peek Button — improved */
    #teaserBtn { margin-top: 30px; padding: 12px 28px; font-size: 1.1rem; border: none; border-radius: 999px; background: linear-gradient(135deg, #ff85a1, #ffb347); color:#fff; font-weight:bold; cursor:pointer; box-shadow:0 6px 15px rgba(0,0,0,0.2); animation:pulseGlow 2s infinite; transition: transform 0.2s, box-shadow 0.3s; z-index:3; }
    #teaserBtn:hover { transform: scale(1.07); box-shadow: 0 8px 18px rgba(0,0,0,0.3); }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 10px rgba(255,150,200,0.6), 0 0 20px rgba(255,100,150,0.4); } 50% { box-shadow: 0 0 20px rgba(255,200,220,0.9), 0 0 40px rgba(255,120,160,0.6); } }

    /* Sneak Peek button in Night Mode */
    body.night #teaserBtn {
    background: linear-gradient(135deg, #4facfe, #8e2de2); /* aurora tones */
    box-shadow: 0 0 15px rgba(100,200,255,0.6),
                0 0 30px rgba(150,100,255,0.4);
    }

    body.night #teaserBtn:hover {
    transform: scale(1.07);
    box-shadow: 0 0 25px rgba(120,220,255,0.8),
                0 0 45px rgba(180,120,255,0.6);
    }

    /* Heart-Bowl button (bottom-left) */
    .heart-bowl{
    position: absolute;
    left: 20px; 
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    width: 70px; height: 60px;

    padding: 0; border: 0; background: transparent;
    cursor: pointer; z-index: 6;
    transform-origin: left bottom;

    /* prevent blue/gray tap highlight & default button skin */
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none;
    appearance: none;

    /* avoid accidental selection/callout on mobile */
    -webkit-touch-callout: none;
    user-select: none;

    /* remove focus outline for mouse/touch; keep a11y ring via :focus-visible below */
    outline: none;
    }

    /* firefox legacy inner focus ring */
    .heart-bowl::-moz-focus-inner{ border: 0; }

    /* only show a ring for keyboard focus (not on taps/clicks) */
    .heart-bowl:focus{ outline: none; }
    .heart-bowl:focus-visible{
    outline: 2px solid rgba(255,255,255,0.6);
    outline-offset: 4px;
    }

    /* ensure clicks hit the button, not children */
    .heart-bowl .heart-svg,
    .heart-bowl .heart-label{ pointer-events: none; }

    @media (max-height: 600px){
    .heart-bowl{ transform: scale(.9); }
    }
    @media (max-height: 520px){
    .heart-bowl{ transform: scale(.8); }
    }
    .heart-svg{ width: 100%; height: 100%; display:block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }

    /* Liquid fill: scale from bottom using CSS var --fill (0..1) */
    .fill-rect{
    transform-origin: 100px 180px;               /* bottom center of viewBox */
    transform: scaleY(var(--fill, 0));
    transition: transform .45s cubic-bezier(.2,.7,.2,1);
    opacity: 1;
    }
    .fill-rect.night{ opacity: 0; }                /* day by default */
    body.night .fill-rect.day{ opacity: 0; }
    body.night .fill-rect.night{ opacity: 1; }

    .heart-outline{ stroke: rgba(255,255,255,.9); }
    body.night .heart-outline{ stroke: rgba(150,220,255,.95); filter: drop-shadow(0 0 10px rgba(120,200,255,.6)); }

    /* label INSIDE the heart (centered) */
    .heart-label{
    position: absolute;
    left: 50%; 
    top: 52%;                      /* a tiny bit below visual center looks nicer */
    transform: translate(-50%, -50%);
    width: 90%;                    /* prevent overflow on small screens */
    text-align: center;
    font-weight: 700; 
    font-size: .35rem; 
    line-height: 1.1;
    color: #fff;
    pointer-events: none;          /* clicks still hit the heart button */
    text-shadow: 
        0 1px 2px rgba(0,0,0,.45),   /* subtle outline for readability */
        0 0 8px rgba(0,0,0,.25);
    -webkit-text-stroke: .3px rgba(0,0,0,.25); /* extra legibility */
    }
    .heart-bowl.bump .heart-label{ transform: translate(-50%,-50%) scale(1.06); transition: transform .2s ease; }


    /* Near full: gentle anticipation glow */
    .heart-bowl.near-full .heart-outline{ filter: drop-shadow(0 0 16px rgba(255,120,160,.7)); }
    body.night .heart-bowl.near-full .heart-outline{ filter: drop-shadow(0 0 16px rgba(120,220,255,.8)); }

    /* Explosion particles */
    .flying-heart{
    position: absolute; left:0; top:0; font-size: 1.2rem; pointer-events:none;
    animation: bowlBurst 900ms ease-out forwards;
    }
    @keyframes bowlBurst{
    from{ opacity:1; transform: translate(0,0) scale(1); }
    to  { opacity:0; transform: translate(var(--dx), var(--dy)) scale(.6) rotate(20deg); }
    }


    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      #countdown { font-size: 1rem; gap: 10px; }
      .number { font-size: 1.5rem; }
      .face { width: 70px; height: 70px; }
      .body { width: 80px; height: 100px; }
      .couple { gap: 30px; }
      #teaserBtn { font-size: 1rem; padding: 10px 22px; }
      .flag { font-size: 2rem; }
    }
    @media (max-width: 360px){
      .couple{ gap:18px; }
      .left-hand{ left:64px; } .right-hand{ right:64px; }
    }
      
    @keyframes dance {
      0%   { transform: rotate(0deg) translateY(0); }
      20%  { transform: rotate(-10deg) translateY(-10px); }
      40%  { transform: rotate(10deg) translateY(0); }
      60%  { transform: rotate(-10deg) translateY(-10px); }
      80%  { transform: rotate(10deg) translateY(0); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    .character.dance {
      animation: dance 1s infinite ease-in-out;
    }


  
    .flipped-plane {
      display: inline-block;
      transform: scaleX(-1);
    }

</style></head>
<body>
  <!-- Sound toggle in header -->
<header>
  <button id="soundToggle" class="control-btn" aria-pressed="false" aria-label="Toggle sound">
    <span id="soundIcon">🔇</span> <span id="soundText">Sound OFF</span>
  </button>
  <button id="modeToggle" class="control-btn" aria-label="Toggle night mode">🌙 Night Mode</button>
</header>

  <!-- Signature & Watermark (original positions) -->
  <div class="signature">Şila'm</div>
  <div class="watermark" aria-hidden="true">Şila'm</div>

  <h1>💖 Counting down to our day 💖</h1>
  <div id="countdown" aria-live="polite" aria-atomic="true">
    <div class="unit"><span class="number" id="days">0</span><span class="label">Days</span></div>
    <div class="unit"><span class="number" id="hours">0</span><span class="label">Hours</span></div>
    <div class="unit"><span class="number" id="minutes">0</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="number" id="seconds">0</span><span class="label">Seconds</span></div>
  </div>

  <div class="couple" id="couple">
    <div class="character">
      <div class="face"><img src="photo_ben.jpeg" alt="Me"></div>
      <div class="body"></div>
      <div class="hand left-hand"></div>
    </div>
    <div class="character">
      <div class="face"><img src="photo_silam.jpeg" alt="Her"></div>
      <div class="body"></div>
      <div class="hand right-hand"></div>
    </div>
  </div>

  <!-- Sneak Peek Button -->
  <button id="teaserBtn">✨ Sneak Peek ✨</button>

  <!-- Plane -->
  <div id="plane"><span class="flipped-plane">✈️</span></div>

  <!-- Flags -->
  <div class="flag korea">🇰🇷</div>
  <div class="flag turkey">🇹🇷</div>

  <!-- Vignette -->
  <div class="vignette" id="vignette"></div>

  <div class="celebration" id="celebration">🎉 Huggy huggy, my love! 🎉</div>

  <!-- Your custom voice line (replace src with your file) -->
  <audio id="voiceAudio" preload="auto">
    <source src="myvoice.mp3" type="audio/mpeg">
  </audio>

  <!-- Heart-Bowl “I miss you” (bottom-left) -->
  <button id="heartBowl" class="heart-bowl" aria-label="I miss you" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <svg class="heart-svg" viewBox="0 0 200 180" aria-hidden="true">
      <defs>
        <!-- Gradients for day/night fill -->
        <linearGradient id="loveGradDay" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"  stop-color="#ff4d6d"/>
          <stop offset="100%" stop-color="#ff98b0"/>
        </linearGradient>
        <linearGradient id="loveGradNight" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"  stop-color="#4facfe"/>
          <stop offset="100%" stop-color="#8e2de2"/>
        </linearGradient>
        <!-- Heart clip path -->
        <clipPath id="heartClip">
          <path d="M100 170
                   C 90 150, 50 130, 30 100
                   C -5  60, 25  20, 60  30
                   C 80  35, 95  50, 100 65
                   C 105 50, 120 35, 140 30
                   C 175 20, 205 60, 170 100
                   C 150 130, 110 150, 100 170 Z"/>
        </clipPath>
      </defs>

      <!-- Liquid fill (scaled from bottom using --fill) -->
      <rect class="fill-rect day"   x="0" y="0" width="200" height="180" clip-path="url(#heartClip)" fill="url(#loveGradDay)"/>
      <rect class="fill-rect night" x="0" y="0" width="200" height="180" clip-path="url(#heartClip)" fill="url(#loveGradNight)"/>

      <!-- Bowl outline -->
      <path class="heart-outline" fill="none" stroke-width="6"
            d="M100 170
               C 90 150, 50 130, 30 100
               C -5  60, 25  20, 60  30
               C 80  35, 95  50, 100 65
               C 105 50, 120 35, 140 30
               C 175 20, 205 60, 170 100
               C 150 130, 110 150, 100 170 Z"/>
    </svg>
    <span class="heart-label">I miss you ❤️</span>
  </button>

  <script>
    const targetDate = new Date("2025-11-07T07:00:00");
    const couple = document.getElementById("couple");
    const celebration = document.getElementById("celebration");
    const vignette = document.getElementById("vignette");

    // Sound toggle
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const voiceAudio = document.getElementById('voiceAudio');

    // Mode toggle (day/night)
    const modeToggle = document.getElementById("modeToggle");

    function setMode(night) {
    document.body.classList.toggle("night", night);
    document.body.classList.toggle("day", !night);
    localStorage.setItem("nightMode", night);
    modeToggle.textContent = night ? "☀️ Day Mode" : "🌙 Night Mode";
    }

    // Load preference OR auto-set by time
    (function initMode(){
    const stored = localStorage.getItem("nightMode");
    if (stored !== null) {
        setMode(stored === "true");
    } else {
        const hour = new Date().getHours();
        setMode(hour >= 19 || hour < 7); // auto-night if after 7pm or before 7am
    }
    })();

    // Toggle on click
    modeToggle.addEventListener("click", () => {
    const night = !document.body.classList.contains("night");
    setMode(night);
    });

    // Generate stars (only once, they stay for both modes)
    for (let i=0; i<50; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDuration = (1 + Math.random()*3) + "s";
    document.body.appendChild(star);
    }

    // Aurora Ribbons (northern lights)
    const ribbonColors = [
    "linear-gradient(180deg, rgba(0,255,200,0.2) 0%, rgba(0,0,0,0) 80%)",
    "linear-gradient(180deg, rgba(200,0,255,0.2) 0%, rgba(0,0,0,0) 80%)",
    "linear-gradient(180deg, rgba(0,150,255,0.2) 0%, rgba(0,0,0,0) 80%)"
    ];

    for (let i = 0; i < 3; i++) {
    const ribbon = document.createElement("div");
    ribbon.className = "aurora-ribbon";
    ribbon.style.left = (i * 30) + "vw"; // spread ribbons across screen
    ribbon.style.background = ribbonColors[i % ribbonColors.length];
    ribbon.style.animationDuration = (25 + Math.random()*20) + "s";
    document.body.appendChild(ribbon);
    }



    let storedSound = localStorage.getItem('soundOn');
    let soundOn = storedSound !== null ? (storedSound === 'true') : true; 
    function updateSoundUI(){
      soundToggle.setAttribute('aria-pressed', String(soundOn));
      soundIcon.textContent = soundOn ? '🔊' : '🔇';
      soundText.textContent = soundOn ? 'Sound ON' : 'Sound OFF';
      voiceAudio.muted = !soundOn;
    }
    updateSoundUI();
    document.body.classList.add('ready');
    soundToggle.addEventListener('click', ()=>{ soundOn = !soundOn; localStorage.setItem('soundOn', String(soundOn)); updateSoundUI(); });
    function tryPlayVoice(){ if(!soundOn) return; voiceAudio.currentTime = 0; voiceAudio.play().catch(()=>{}); }

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        celebration.style.display = "flex";
        couple.style.gap = "0px";
        createConfetti();
        tryPlayVoice();
        clearInterval(interval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;

    }

    let interval = setInterval(updateCountdown, 1000);
    updateCountdown();

    // Floating hearts — original idle behavior
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.animationDuration = 3 + Math.random() * 3 + "s";
      heart.textContent = "❤";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 800);

    // Love Notes
    const LOVE_NOTES = [
    "I ❤️ U",
    "Forever together 💕",
    "Şila’m 💖",
    "Huggy huggy 🤗",
    "Counting down ⏳",
    "My everything ✨"
    ];

    function createLoveNote() {
    const note = document.createElement("div");
    note.className = "love-note";
    note.textContent = LOVE_NOTES[Math.floor(Math.random() * LOVE_NOTES.length)];
    note.style.left = Math.random() * 80 + "vw";
    note.style.top = (Math.random() * 40 + 40) + "vh";
    document.body.appendChild(note);

    // Click → pop with sparkles
    note.addEventListener("click", () => {
    const message = note.textContent;
    const rect = note.getBoundingClientRect();

    // Clear the note text & fade background
    note.textContent = "";
    note.style.background = "transparent";
    note.style.boxShadow = "none";

    // Split message into characters
    message.split("").forEach((char, i) => {
        const fragment = document.createElement("div");
        fragment.className = "fragment";
        fragment.textContent = char;

        // Position each fragment at the note’s location
        fragment.style.left = rect.left + window.scrollX + 10 + "px";
        fragment.style.top = rect.top + window.scrollY + 10 + "px";

        // Random fly directions
        const dx = (Math.random() - 0.5) * 120 + "px";
        const dy = (Math.random() - 0.5) * 120 + "px";
        fragment.style.setProperty("--dx", dx);
        fragment.style.setProperty("--dy", dy);

        document.body.appendChild(fragment);
        setTimeout(() => fragment.remove(), 800);
    });

    setTimeout(() => note.remove(), 500);
    });


    setTimeout(() => note.remove(), 6000);
    }


    // Show a note every 30s
    setInterval(createLoveNote, 20000);


    // Celebration confetti hearts
    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }
    }

    // Sneak peek button logic
    const teaserBtn = document.getElementById("teaserBtn");
    const characters = document.querySelectorAll(".character");
    const plane = document.getElementById("plane");

    teaserBtn.addEventListener("click", () => {
      characters.forEach(c => { c.classList.add("teaser"); c.classList.add("dance"); });
      couple.classList.add("teaser-gap");
      vignette.classList.add("show");

      plane.classList.add("fly");
      tryPlayVoice();

      let messageIndex = 0;
    let trailCount = 0;
    const SKY_MESSAGE = ["U", "❤️", "I"];

    let trailInterval = setInterval(() => {
    const trail = document.createElement("div");
    trail.className = "trail";

    // Show message after a few puffs
    if (trailCount >= 25 && messageIndex < SKY_MESSAGE.length) {
        trail.textContent = SKY_MESSAGE[messageIndex];
        messageIndex++;
    } else {
        trail.textContent = Math.random() > 0.5 ? "💕" : "☁️";
    }

    trail.style.left = (plane.getBoundingClientRect().left - 20) + "px";
    trail.style.top = (plane.getBoundingClientRect().top) + "px";
    document.body.appendChild(trail);
    setTimeout(() => trail.remove(), 4000);

    trailCount++;
    }, 300);


      const SNEAK_PEEK_MS = 18000;
      setTimeout(() => {
        characters.forEach(c => { c.classList.remove("teaser"); c.classList.remove("dance"); });
        couple.classList.remove("teaser-gap");
        plane.classList.remove("fly");
        vignette.classList.remove("show");
        clearInterval(trailInterval);
      }, SNEAK_PEEK_MS);
    });

    // --- Heart-Bowl logic ---
(function heartBowlInit(){
  const bowl = document.getElementById('heartBowl');
  if (!bowl) return;

  const svg = bowl.querySelector('.heart-svg');
  let fill = 0; // 0..1

  function applyFill(){
    svg.style.setProperty('--fill', fill);
    bowl.setAttribute('aria-valuenow', Math.round(fill*100));
    bowl.classList.toggle('near-full', fill >= 0.8 && fill < 1);
  }

  function flingHearts(x, y, n=28){
    for (let i=0; i<n; i++){
      const p = document.createElement('div');
      p.className = 'flying-heart';
      p.textContent = Math.random() < .75 ? '💕' : '✨';
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      const angle = Math.random()*Math.PI*2;
      const dist  = 60 + Math.random()*140;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }

  function explode(){
    const r = bowl.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top  + r.height/2;
    flingHearts(cx, cy, 30);
    bowl.classList.remove('near-full');
    fill = 0; applyFill();
  }

  // initial
  applyFill();

  // click to fill; +10% per click; explode at 100%
  bowl.addEventListener('click', ()=>{
    if (fill >= 1) return;
    fill = Math.min(1, fill + 0.10);
    applyFill();
    bowl.classList.add('bump');
    setTimeout(()=>bowl.classList.remove('bump'), 220);
    if (fill >= 1){
      setTimeout(explode, 140); // tiny suspense
    }
  });

  // accessibility: Space/Enter also fill
  bowl.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); bowl.click();
    }
  });
})();
